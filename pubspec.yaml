name: timer
description: "A silent visual timer and stopwatch on one time axis."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  wakelock_plus: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/world.frag
  assets:
    - assets/licenses/
  fonts:
    - family: Label
      fonts:
        - asset: assets/fonts/RobotoFlexLabel.ttf
